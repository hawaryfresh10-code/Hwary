<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفاصيل المنتج | Hawary Fresh</title><style>
:root{--green:#0f4b2e;--green2:#28784a;--cream:#f7f3e8;--gold:#d8b64a;--white:#fff}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--cream);color:#173b29}a{text-decoration:none}.top{background:var(--green);color:#fff;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-weight:900;font-size:22px}.back{color:#fff;border:1px solid #ffffff55;border-radius:999px;padding:9px 16px}.wrap{max-width:1100px;margin:auto;padding:35px 18px 60px}.card{background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 12px 35px #163f2a18;display:grid;grid-template-columns:1fr 1fr}.photo{min-height:520px;background:#f3f5ed;display:flex;align-items:center;justify-content:center;padding:25px}.photo img{width:100%;height:100%;max-height:560px;object-fit:contain;border-radius:20px}.info{padding:42px}.ey{color:var(--green2);font-weight:800;letter-spacing:1px}h1{font-size:42px;margin:10px 0 18px}.desc{line-height:1.9;color:#52685b;font-size:17px}.box{background:#f4f8f1;border:1px solid #dfe9dc;border-radius:18px;padding:18px;margin:25px 0}label{display:block;font-weight:800;margin:12px 0 6px}input,textarea{width:100%;border:1px solid #ccd9cf;border-radius:12px;padding:13px;font:inherit}textarea{min-height:100px;resize:vertical}button{width:100%;border:0;border-radius:14px;background:var(--green);color:#fff;padding:15px;font-size:17px;font-weight:900;cursor:pointer;margin-top:14px}button:hover{background:#0a3a23}.note{font-size:13px;color:#718077;margin-top:12px}@media(max-width:760px){.card{grid-template-columns:1fr}.photo{min-height:330px}.info{padding:26px}h1{font-size:32px}}
</style></head><body><header class="top"><div class="brand">هــواري فريش | HAWARY FRESH</div><a class="back" href="index.html#products">← العودة للمنتجات</a></header><main class="wrap"><div id="product"></div></main><script>
const products={
'artichoke': {name:'الخرشوف', desc:'خرشوف طازج مناسب للتوريد والتصدير حسب المواصفات والطلب.', img:'images/product_01.jpg', alt:'الخرشوف المجمد وأقراص الخرشوف'},
'broccoli': {name:'البروكلي', desc:'بروكلي طازج للتوريد والتجهيز والتعبئة حسب متطلبات العميل.', img:'images/product_02.jpg', alt:'البروكلي'},
'green-jalapeno': {name:'هالبينو أخضر', desc:'فلفل هالبينو أخضر طازج، متاح للتوريد حسب الموسم والكميات.', img:'images/product_03.jpg', alt:'هالبينو أخضر'},
'baby-artichoke': {name:'خرشوف صغير', desc:'خرشوف صغير مختار بعناية، مناسب للتجهيز والتوريد.', img:'images/product_04.jpg', alt:'خرشوف صغير'},
'artichoke-prepared': {name:'خرشوف مجهز', desc:'خرشوف مجهز ومقطع، مناسب للطلبات التي تحتاج تجهيزاً مسبقاً.', img:'images/product_05.jpg', alt:'خرشوف مجهز'},
'baby-artichoke-fresh': {name:'خرشوف طازج صغير', desc:'خرشوف طازج صغير من المنتج إلى التجهيز والتوريد.', img:'images/product_06.jpg', alt:'خرشوف طازج صغير'},
'jalapeno': {name:'هالبينو أخضر', desc:'هالبينو أخضر طازج للتوريد والتصدير حسب المواصفات.', img:'images/product_03.jpg', alt:'هالبينو أخضر'},
'red-chili': {name:'فلفل أحمر', desc:'فلفل أحمر طازج ومجهز حسب احتياجات الطلب.', img:'images/product_07.jpg', alt:'فلفل أحمر'},
'chili-plant': {name:'فلفل طازج من المزرعة', desc:'صور مباشرة من المزرعة لمنتج الفلفل الطازج.', img:'images/product_08.jpg', alt:'فلفل طازج من المزرعة'},
'artichoke-hearts': {name:'قلوب الخرشوف', desc:'قلوب خرشوف مجهزة للتوريد، مع إمكانية تحديد طريقة التعبئة حسب الطلب.', img:'images/product_01.jpg', alt:'قلوب الخرشوف'},
'strawberry': {name:'فراولة مجمدة', desc:'فراولة مجمدة للتوريد والتصدير، مع خيارات تعبئة حسب الطلب.', img:'images/product_09.jpg', alt:'فراولة مجمدة'},
'molokhia': {name:'ملوخية مجمدة', desc:'ملوخية مجمدة بجودة مناسبة للتوريد والتصدير حسب المواصفات المطلوبة.', img:'images/product_10.jpg', alt:'ملوخية مجمدة'}
};
const id=new URLSearchParams(location.search).get('id')||'artichoke'; const item=products[id]||products.artichoke;
const el=document.getElementById('product');
el.innerHTML=`<section class="card"><div class="photo"><img src="${item.img}" alt="${item.alt}"></div><div class="info"><div class="ey">PRODUCT DETAILS</div><h1>${item.name}</h1><p class="desc">${item.desc}</p><div class="box"><strong>اطلب هذا المنتج مباشرة</strong><label>الاسم</label><input id="name" placeholder="اكتب اسمك"><label>رقم الهاتف</label><input id="phone" type="tel" placeholder="رقم الهاتف"><label>الكمية المطلوبة</label><input id="qty" placeholder="مثال: 500 كجم / 100 كرتونة"><label>ملاحظات</label><textarea id="notes" placeholder="المقاس، التعبئة، موعد التوريد أو أي تفاصيل أخرى"></textarea><button onclick="sendOrder()">إرسال الطلب عبر واتساب</button><div class="note">سيتم فتح واتساب لإرسال تفاصيل طلبك إلى Hawary Fresh.</div></div></div></section>`;
function sendOrder(){const n=document.getElementById('name').value.trim(),ph=document.getElementById('phone').value.trim(),q=document.getElementById('qty').value.trim(),no=document.getElementById('notes').value.trim();if(!n||!ph||!q){alert('من فضلك اكتب الاسم ورقم الهاتف والكمية.');return}const text=`طلب منتج من موقع Hawary Fresh%0Aالمنتج: ${item.name}%0Aالاسم: ${n}%0Aالهاتف: ${ph}%0Aالكمية: ${q}%0Aملاحظات: ${no||'-'}`;location.href='https://wa.me/201222733777?text='+encodeURIComponent(text)}
</script></body></html>
